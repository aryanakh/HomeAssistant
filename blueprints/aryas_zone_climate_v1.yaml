blueprint:
  name: "AryaNakh Zone Climate Control (v1.0.0)"
  author: AryaNakh
  homeassistant:
    min_version: 2024.11.0
  description: |
    # AryaNakh Zone Climate Control v1.0.0

    Intelligent 4-room HVAC zone control with relay-board vent dampers.
    The thermostat is in a hallway — all comfort decisions are made from
    per-room temperature sensors, not the thermostat's own reading.

    ## Key Features
    - Stale sensor detection: rooms whose sensors haven't reported in N minutes
      are skipped so a silent sensor never drives the HVAC
    - Outdoor temperature awareness: suppresses wasteful mode switching when
      it is very hot or cold outside (configurable override threshold)
    - Away mode: any helper / person / device_tracker entity; HVAC turns off
      and all dampers open until someone returns
    - Per-room cool-disable helper: lets an external boolean (e.g. geofence,
      schedule) prevent a room from receiving cooling
    - Mode-switch hysteresis: ties always favour the current HVAC mode to
      avoid unnecessary heat ↔ cool transitions
    - Immediate re-trigger when any room crosses its min or max threshold

    ## Damper Wiring (Normally-Open Relay Board)
    Switch OFF → damper open (air flows)
    Switch ON  → damper closed (air blocked)

    ## Room Rules
    - hold_range : heat AND cool to keep the room within its band
    - heat_only  : only requests heating; damper closes when AC runs
    - cool_only  : only requests cooling; damper closes when heater runs
    - disabled   : room is ignored; damper stays open

  domain: automation

  input:
    # -------------------------------------------------------------------------
    # GLOBAL
    # -------------------------------------------------------------------------
    thermostat:
      name: Thermostat
      description: The single climate entity controlling both heating and cooling.
      selector:
        entity:
          domain: climate

    away_entity:
      name: Away Mode Entity (optional)
      description: >
        input_boolean, person, or device_tracker. When the state is off / away /
        not_home the HVAC turns off and all dampers open. Leave blank to disable.
      default: {}
      selector:
        entity: {}

    outdoor_sensor:
      name: Outdoor Temperature Sensor (optional)
      description: >
        Used to suppress wasteful mode switching. Leave blank to disable
        outdoor-aware logic.
      default: {}
      selector:
        entity:
          domain: sensor
          device_class: temperature

    outdoor_heat_suppress_above:
      name: Suppress Heating Above (°F)
      description: >
        When outdoor temp exceeds this value, heating is suppressed unless the
        room deviation exceeds the override delta below.
      default: 78
      selector:
        number:
          min: 60
          max: 95
          step: 1

    outdoor_cool_suppress_below:
      name: Suppress Cooling Below (°F)
      description: >
        When outdoor temp is below this value, cooling is suppressed unless the
        room deviation exceeds the override delta below.
      default: 50
      selector:
        number:
          min: 35
          max: 70
          step: 1

    outdoor_suppress_override_delta:
      name: Outdoor Suppression Override (°F)
      description: >
        A room must be this many degrees outside its range to override outdoor
        suppression. Prevents waste while still protecting against extremes.
      default: 3
      selector:
        number:
          min: 1
          max: 10
          step: 0.5

    poll_interval_minutes:
      name: Polling Interval
      description: How often the automation runs. Below 5 min not recommended.
      default: "/10"
      selector:
        select:
          options:
            - label: "Every 5 minutes"
              value: "/5"
            - label: "Every 10 minutes"
              value: "/10"
            - label: "Every 15 minutes"
              value: "/15"
            - label: "Every 30 minutes"
              value: "/30"

    sensor_stale_minutes:
      name: Sensor Stale Threshold (minutes)
      description: >
        If a room sensor has not updated in this many minutes it is skipped.
        This prevents the automation from chasing a silent sensor and avoids
        overshoot-then-correct cycles.
      default: 15
      selector:
        number:
          min: 5
          max: 60
          step: 1

    min_setpoint:
      name: Minimum Thermostat Setpoint (°F)
      description: Hard floor — thermostat will never be commanded below this.
      default: 65
      selector:
        number:
          min: 55
          max: 72
          step: 0.5

    max_setpoint:
      name: Maximum Thermostat Setpoint (°F)
      description: Hard ceiling — thermostat will never be commanded above this.
      default: 82
      selector:
        number:
          min: 73
          max: 90
          step: 0.5

    setpoint_step:
      name: Setpoint Step (°F per cycle)
      description: >
        How much to nudge the thermostat each polling cycle. Smaller values
        reduce overshoot; larger values react faster.
      default: 1.5
      selector:
        number:
          min: 0.5
          max: 3.0
          step: 0.5

    night_start_time:
      name: Night Start Time
      description: When night_only rooms activate (default 9 PM).
      default: "21:00:00"
      selector:
        time: {}

    night_end_time:
      name: Night End Time
      description: When night_only rooms deactivate (default 8 AM).
      default: "08:00:00"
      selector:
        time: {}

    # -------------------------------------------------------------------------
    # ROOM 1
    # -------------------------------------------------------------------------
    room1_name:
      name: "Room 1 — Name"
      default: "Room 1"
      selector:
        text: {}

    room1_sensor:
      name: "Room 1 — Temperature Sensor"
      selector:
        entity:
          domain: sensor
          device_class: temperature

    room1_damper:
      name: "Room 1 — Damper Switch"
      selector:
        entity:
          domain: switch

    room1_damper2:
      name: "Room 1 — Second Damper (optional)"
      default: {}
      selector:
        entity:
          domain: switch

    room1_rule:
      name: "Room 1 — Rule"
      default: hold_range
      selector:
        select:
          options:
            - hold_range
            - heat_only
            - cool_only
            - disabled

    room1_priority:
      name: "Room 1 — Priority (1 = highest)"
      default: 1
      selector:
        number:
          min: 1
          max: 4
          step: 1
          mode: box

    room1_min_temp:
      name: "Room 1 — Min Temperature (°F)"
      default: 68
      selector:
        number:
          min: 55
          max: 80
          step: 0.5

    room1_max_temp:
      name: "Room 1 — Max Temperature (°F)"
      default: 72
      selector:
        number:
          min: 56
          max: 85
          step: 0.5

    room1_cool_disable_entity:
      name: "Room 1 — Disable Cooling Helper (optional)"
      description: >
        When this input_boolean is ON, this room will not receive or request
        cooling. hold_range rooms become heat_only; cool_only rooms are skipped.
      default: {}
      selector:
        entity:
          domain: input_boolean

    room1_schedule:
      name: "Room 1 — Schedule"
      default: always
      selector:
        select:
          options:
            - always
            - night_only
            - day_only

    # -------------------------------------------------------------------------
    # ROOM 2
    # -------------------------------------------------------------------------
    room2_name:
      name: "Room 2 — Name"
      default: "Room 2"
      selector:
        text: {}

    room2_sensor:
      name: "Room 2 — Temperature Sensor"
      selector:
        entity:
          domain: sensor
          device_class: temperature

    room2_damper:
      name: "Room 2 — Damper Switch"
      selector:
        entity:
          domain: switch

    room2_damper2:
      name: "Room 2 — Second Damper (optional)"
      default: {}
      selector:
        entity:
          domain: switch

    room2_rule:
      name: "Room 2 — Rule"
      default: hold_range
      selector:
        select:
          options:
            - hold_range
            - heat_only
            - cool_only
            - disabled

    room2_priority:
      name: "Room 2 — Priority (1 = highest)"
      default: 2
      selector:
        number:
          min: 1
          max: 4
          step: 1
          mode: box

    room2_min_temp:
      name: "Room 2 — Min Temperature (°F)"
      default: 68
      selector:
        number:
          min: 55
          max: 80
          step: 0.5

    room2_max_temp:
      name: "Room 2 — Max Temperature (°F)"
      default: 72
      selector:
        number:
          min: 56
          max: 85
          step: 0.5

    room2_cool_disable_entity:
      name: "Room 2 — Disable Cooling Helper (optional)"
      default: {}
      selector:
        entity:
          domain: input_boolean

    room2_schedule:
      name: "Room 2 — Schedule"
      default: always
      selector:
        select:
          options:
            - always
            - night_only
            - day_only

    # -------------------------------------------------------------------------
    # ROOM 3
    # -------------------------------------------------------------------------
    room3_name:
      name: "Room 3 — Name"
      default: "Room 3"
      selector:
        text: {}

    room3_sensor:
      name: "Room 3 — Temperature Sensor"
      selector:
        entity:
          domain: sensor
          device_class: temperature

    room3_damper:
      name: "Room 3 — Damper Switch"
      selector:
        entity:
          domain: switch

    room3_damper2:
      name: "Room 3 — Second Damper (optional)"
      default: {}
      selector:
        entity:
          domain: switch

    room3_rule:
      name: "Room 3 — Rule"
      default: hold_range
      selector:
        select:
          options:
            - hold_range
            - heat_only
            - cool_only
            - disabled

    room3_priority:
      name: "Room 3 — Priority (1 = highest)"
      default: 3
      selector:
        number:
          min: 1
          max: 4
          step: 1
          mode: box

    room3_min_temp:
      name: "Room 3 — Min Temperature (°F)"
      default: 68
      selector:
        number:
          min: 55
          max: 80
          step: 0.5

    room3_max_temp:
      name: "Room 3 — Max Temperature (°F)"
      default: 72
      selector:
        number:
          min: 56
          max: 85
          step: 0.5

    room3_cool_disable_entity:
      name: "Room 3 — Disable Cooling Helper (optional)"
      default: {}
      selector:
        entity:
          domain: input_boolean

    room3_schedule:
      name: "Room 3 — Schedule"
      default: always
      selector:
        select:
          options:
            - always
            - night_only
            - day_only

    # -------------------------------------------------------------------------
    # ROOM 4
    # -------------------------------------------------------------------------
    room4_name:
      name: "Room 4 — Name"
      default: "Room 4"
      selector:
        text: {}

    room4_sensor:
      name: "Room 4 — Temperature Sensor"
      selector:
        entity:
          domain: sensor
          device_class: temperature

    room4_damper:
      name: "Room 4 — Damper Switch"
      selector:
        entity:
