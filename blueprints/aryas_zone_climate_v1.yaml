    room4_rule:
      name: "Room 4 — Rule"
      default: disabled
      selector:
        select:
          options:
            - hold_range
            - heat_only
            - cool_only
            - disabled

    room4_priority:
      name: "Room 4 — Priority (1 = highest)"
      default: 4
      selector:
        number:
          min: 1
          max: 4
          step: 1
          mode: box

    room4_min_temp:
      name: "Room 4 — Min Temperature (°F)"
